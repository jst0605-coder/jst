<html>
  <head>
    <title>VR + BLE Test</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box id="box" position="0 1.5 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>

    <button id="connectBtn" style="position:absolute;top:10px;left:10px;z-index:999;">Connect ESP32</button>

    <script>
      const serviceUUID = "12345678-1234-5678-1234-56789abcdef0";
      const charUUID    = "12345678-1234-5678-1234-56789abcdef1";
      let characteristic;

      document.getElementById("connectBtn").onclick = async () => {
        try {
          const device = await navigator.bluetooth.requestDevice({
            filters: [{ name: 'ESP32-VR-Test' }],
            optionalServices: [serviceUUID]
          });
          const server = await device.gatt.connect();
          const service = await server.getPrimaryService(serviceUUID);
          characteristic = await service.getCharacteristic(charUUID);

          // Listen for ESP32 notifications
          characteristic.startNotifications();
          characteristic.addEventListener("characteristicvaluechanged", e => {
            let value = new TextDecoder().decode(e.target.value);
            console.log("From ESP32:", value);
            // Change box color every tick
            document.querySelector("#box").setAttribute("color", value.includes("tick") ? "red" : "green");
          });

          alert("Connected to ESP32!");
        } catch (error) {
          console.error(error);
          alert("Failed: " + error);
        }
      };
    </script>
  </body>
</html>
